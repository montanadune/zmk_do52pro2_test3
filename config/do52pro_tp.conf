# Split設定（右側を親機として動作）
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# PS2マウス / トラックポイント設定
CONFIG_ZMK_INPUT_MOUSE_PS2_ENABLE_UROB_COMPAT=n
CONFIG_ZMK_INPUT_ACCELERATOR_LOG_ENABLED=n
CONFIG_CBPRINTF_COMPLETE=n

# スリープ・バッテリー設定（15分でディープスリープ）
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_BATTERY_REPORTING=y

# Bluetooth（BLE）安定化・出力設定
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=n
CONFIG_ZMK_HID_REPORT_TYPE_HKRO=y
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_CTLR_DATA_LENGTH_MAX=27
CONFIG_BT_CTLR_TX_PWR_PLUS_8=n

# ログ・デバッグ機能の完全停止（省電力・軽量化）
CONFIG_ZMK_USB_LOGGING=n
CONFIG_LOG=n
CONFIG_THREAD_STACK_INFO=n
CONFIG_INIT_STACKS=n

# PS2通信エラー時のバッファズレ・暴走防止
CONFIG_ZMK_INPUT_MOUSE_PS2_ENABLE_ERROR_MITIGATION=y
